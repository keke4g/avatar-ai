name: Market comparable ingestion

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum API pages per authorized source
        required: false
        default: '8'
        type: string
  schedule:
    - cron: '37 10 * * *'

permissions:
  contents: read

concurrency:
  group: private-market-comparable-ingestion
  cancel-in-progress: false

jobs:
  collect-and-recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_PAGES: ${{ inputs.max_pages || '8' }}
      EASYBROKER_API_KEY: ${{ secrets.EASYBROKER_API_KEY }}
      EASYBROKER_AUTHORIZATION_REFERENCE: ${{ secrets.EASYBROKER_AUTHORIZATION_REFERENCE }}
      EASYBROKER_AVM_USE_AUTHORIZED: ${{ vars.EASYBROKER_AVM_USE_AUTHORIZED }}
      MERCADOLIBRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIBRE_ACCESS_TOKEN }}
      MERCADOLIBRE_AVM_CONTRACT_ID: ${{ secrets.MERCADOLIBRE_AVM_CONTRACT_ID }}
      MERCADOLIBRE_AVM_USE_AUTHORIZED: ${{ vars.MERCADOLIBRE_AVM_USE_AUTHORIZED }}
      MERCADOLIBRE_SEARCH_BBOX: ${{ vars.MERCADOLIBRE_SEARCH_BBOX }}
      MERCADOLIBRE_CATEGORY_IDS: ${{ vars.MERCADOLIBRE_CATEGORY_IDS }}
      MERCADOLIBRE_SEARCH_CITY: ${{ vars.MERCADOLIBRE_SEARCH_CITY }}
      MERCADOLIBRE_SEARCH_STATE: ${{ vars.MERCADOLIBRE_SEARCH_STATE }}
      MARKET_SCRAPER_USER_AGENT: TowersMexicoMarketResearchBot/1.0 (+https://towersmexico.com)
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/market/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r scrapers/market/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - name: Collect authorized EasyBroker inventory
        if: ${{ env.EASYBROKER_API_KEY != '' && env.EASYBROKER_AVM_USE_AUTHORIZED == 'true' }}
        run: >-
          python -m scrapers.market.authorized_cli
          --provider easybroker
          --max-pages "$MAX_PAGES"
          --max-observations 800
          --upload
      - name: Collect Mercado Libre through its authorized API
        if: ${{ env.MERCADOLIBRE_ACCESS_TOKEN != '' && env.MERCADOLIBRE_AVM_USE_AUTHORIZED == 'true' && env.MERCADOLIBRE_AVM_CONTRACT_ID != '' }}
        run: >-
          python -m scrapers.market.authorized_cli
          --provider mercadolibre-api
          --max-pages "$MAX_PAGES"
          --max-observations 800
          --upload
      - name: Research every current Towers micromarket with Scrapling
        continue-on-error: true
        run: >-
          python -m scrapers.market.batch_cli
          --max-pages "$MAX_PAGES"
          --delay 3
          --upload
      - name: Recalculate private Towers estimates
        run: npm run valuation:recalculate-market
