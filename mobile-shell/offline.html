<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071827" />
    <title>Sin conexión · Towers México</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071827;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top right, rgba(34, 211, 238, 0.17), transparent 38%),
          linear-gradient(145deg, #071827, #0c2638);
      }

      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.74);
        box-shadow: 0 24px 64px rgba(2, 6, 23, 0.35);
        text-align: center;
      }

      .icon { margin-bottom: 18px; color: #67e8f9; font-size: 38px; }
      h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: -0.03em; }
      p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.65; }
      button {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 14px 18px;
        background: #22d3ee;
        color: #071827;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>Necesitas conexión</h1>
      <p>Comprueba tus datos o Wi-Fi para volver a conectar con Towers México.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
