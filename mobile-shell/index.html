<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071827" />
    <title>Towers México</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071827;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top right, rgba(34, 211, 238, 0.17), transparent 38%),
          linear-gradient(145deg, #071827, #0c2638);
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(103, 232, 249, 0.35);
        border-radius: 22px;
        background: rgba(8, 47, 73, 0.72);
        color: #67e8f9;
        font-size: 30px;
        font-weight: 800;
      }

      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.03em; }
      p { margin: 0; color: #cbd5e1; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T</div>
      <h1>Towers México</h1>
      <p>Preparando tu experiencia inmobiliaria…</p>
    </main>
  </body>
</html>
